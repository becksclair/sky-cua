name: js

# Runs the `just verify-js` gate on GitHub-hosted runners. Rust and Python run
# in rust.yml and python.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same bun as the dev host and Saga runner.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # runtime/cua-node and browser-use tests spawn `node`; match the
      # engines pin in packages/browser-use/package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - uses: extractions/setup-just@v4

      # The real-Chrome DOM acceptance test skips here: the runner has Chrome
      # but not the assembled out/components/cua-node-linux-x64-glibc tree.
      - name: Verify bun packages
        run: just verify-js
