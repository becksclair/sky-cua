[workspace]
members = [
  "crates/sky-cua-platform",
  "crates/sky-cua-linux",
  "crates/sky-cua-windows",
  "crates/sky-cua-service",
  "crates/sky-cua-client",
]
default-members = [
  "crates/sky-cua-platform",
  "crates/sky-cua-service",
  "crates/sky-cua-client",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Rebecca Clair"]

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
ashpd = { version = "0.13.10", default-features = false, features = ["tokio", "screencast", "screenshot", "remote_desktop"] }
atspi = { version = "0.29.0", features = ["tokio"] }
chrono = { version = "0.4.42", features = ["serde"] }
enumflags2 = "0.7.12"
gstreamer = { version = "0.25.1", features = ["v1_22"] }
gstreamer-app = { version = "0.25.0", features = ["v1_22"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time", "fs", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
webp = { version = "0.3.1", default-features = false }
windows = "0.62.2"
windows-sys = "0.61.2"
zbus = { version = "5.14.0", features = ["tokio"] }
url = "2.5.7"
