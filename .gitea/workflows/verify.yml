name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: saga-sky-cua-build
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify Rust
        env:
          NEXTEST_PROFILE: ci
        run: just verify-rust

  python:
    runs-on: saga-sky-cua-build
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Build Browser Use client
        working-directory: packages/browser-use
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Sync Python environment
        run: uv sync --dev

      - name: Verify Python
        run: just verify-python

  js:
    runs-on: saga-sky-cua-build
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify bun packages
        run: just verify-js

  # Kotlin companion unit tests remain a local gate through `just verify-kotlin`.
  # The Gitea host runner does not need an Android SDK solely for this workflow.
