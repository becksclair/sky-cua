name: Publish Heliasar Marketplace

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux-x64:
    runs-on: asgard-build-1
    steps:
      - uses: actions/checkout@v4
      - name: Build release runtime
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --package sky-cua-client --package sky-cua-service
      - name: Package runtime artifact
        run: python3 scripts/package_runtime_artifact.py --platform linux-x64 --output-root artifacts/runtime
      - uses: actions/upload-artifact@v3
        with:
          name: sky-cua-runtime-linux-x64
          path: artifacts/runtime/linux-x64

  build-linux-arm64:
    runs-on: orion-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build release runtime
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --package sky-cua-client --package sky-cua-service
      - name: Package runtime artifact
        run: python3 scripts/package_runtime_artifact.py --platform linux-arm64 --output-root artifacts/runtime
      - uses: actions/upload-artifact@v3
        with:
          name: sky-cua-runtime-linux-arm64
          path: artifacts/runtime/linux-arm64

  build-windows-x64:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4
      - name: Build release runtime
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set CARGO_HOME=C:\Users\bex\.cargo
          set RUSTUP_HOME=C:\Users\bex\.rustup
          set RUSTC_WRAPPER=
          set RUSTC_WORKSPACE_WRAPPER=
          set PATH=C:\Users\bex\.cargo\bin;%PATH%
          cargo build --release --package sky-cua-client --package sky-cua-service
      - name: Package runtime artifact
        shell: cmd
        run: |
          set CARGO_HOME=C:\Users\bex\.cargo
          set RUSTUP_HOME=C:\Users\bex\.rustup
          set PATH=C:\Users\bex\.cargo\bin;%PATH%
          python scripts/package_runtime_artifact.py --platform windows-x64 --output-root artifacts/runtime
      - uses: actions/upload-artifact@v3
        with:
          name: sky-cua-runtime-windows-x64
          path: artifacts/runtime/windows-x64

  publish:
    runs-on: asgard-build-1
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-windows-x64
    env:
      GITEA_SERVER_URL: https://git.heliasar.com
      MARKETPLACE_REPO: bex/heliasar-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: sky-cua-runtime-linux-x64
          path: artifacts/release-runtimes/linux-x64
      - uses: actions/download-artifact@v3
        with:
          name: sky-cua-runtime-linux-arm64
          path: artifacts/release-runtimes/linux-arm64
      - uses: actions/download-artifact@v3
        with:
          name: sky-cua-runtime-windows-x64
          path: artifacts/release-runtimes/windows-x64
      - name: Build plugin scaffold
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/build_plugin.py
      - name: Clone Heliasar marketplace
        env:
          HELIASAR_MARKETPLACE_TOKEN: ${{ secrets.HELIASAR_MARKETPLACE_TOKEN }}
        run: |
          test -n "$HELIASAR_MARKETPLACE_TOKEN"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'bex' ;;
            *Password*) printf '%s\n' "$HELIASAR_MARKETPLACE_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git clone "https://git.heliasar.com/${MARKETPLACE_REPO}.git" "$RUNNER_TEMP/heliasar-marketplace"
          git -C "$RUNNER_TEMP/heliasar-marketplace" config user.name "sky-cua release bot"
          git -C "$RUNNER_TEMP/heliasar-marketplace" config user.email "sky-cua-release@git.heliasar.com"
      - name: Publish marketplace update
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HELIASAR_MARKETPLACE_TOKEN: ${{ secrets.HELIASAR_MARKETPLACE_TOKEN }}
        run: |
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            python3 scripts/publish_marketplace_release.py \
            --no-build \
            --skip-codex-install \
            --runtime-artifacts artifacts/release-runtimes \
            --version-from-tag \
            --marketplace-root "$RUNNER_TEMP/heliasar-marketplace"
