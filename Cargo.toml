[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

[workspace]
members = [
  "crates/sky-cua-platform",
  "crates/sky-cua-linux",
  "crates/sky-cua-windows",
  "crates/sky-cua-service",
  "crates/sky-cua-client",
  "crates/sky-cua-chrome-host",
  "crates/sky-cua-cosmic-helper",
  "crates/sky-cua-overlay-host",
]
default-members = [
  "crates/sky-cua-platform",
  "crates/sky-cua-service",
  "crates/sky-cua-client",
  "crates/sky-cua-chrome-host",
  "crates/sky-cua-overlay-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Rebecca Clair"]

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
ashpd = { version = "0.13.10", default-features = false, features = ["tokio", "screencast", "screenshot", "remote_desktop"] }
atspi = { version = "0.29.0", features = ["tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "160b086", default-features = false, features = ["client"] }
enumflags2 = "0.7.12"
gstreamer = { version = "0.25.1", features = ["v1_22"] }
gstreamer-app = { version = "0.25.0", features = ["v1_22"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.145"
reis = "0.6.1"
smithay-client-toolkit = { version = "0.20.0", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "io-util", "time", "fs", "sync"] }
tracing = { version = "0.1.41", features = ["release_max_level_info"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
webp = { version = "0.3.1", default-features = false }
windows = { version = "0.62.2", default-features = false }
windows-sys = "0.61.2"
xkbcommon = "0.9.0"
zbus = { version = "5.14.0", features = ["tokio"] }
url = "2.5.7"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
x11rb = { version = "0.13.2", features = ["shape", "xfixes"] }
