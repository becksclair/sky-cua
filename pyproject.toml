[project]
name = "sky-cua-python-harnesses"
version = "0.1.0"
description = "Python harnesses and operator smoke tests for sky-cua."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.31.4",
    "pillow>=12.0.0",
    "pygobject-stubs>=2.17.0",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

# pygobject-stubs picks its Gtk stub flavor at build time; the repo's only
# Gtk consumer (gtk_pointer_smoke_fixture.py) is GTK3. The Gio/GLib stubs the
# ScreenCast portal helper needs are identical in both flavors.
[tool.uv.config-settings-package]
pygobject-stubs = { config = "Gtk3,Gdk3" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = [
    "_app_server_harness",
    "_codex_app_server",
    "_codex_exec",
    "_plugin_bundle",
    "live_desktop_smoke",
    "live_phone_use_smoke",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py", "*_test.py"]

[tool.basedpyright]
include = ["scripts"]
exclude = [
    "**/__pycache__",
    ".venv",
    "artifacts",
    "dist",
    "target",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportAny = false
reportExplicitAny = false
reportMissingImports = false
# gi.repository modules are generated at runtime; pygobject-stubs is the only
# resolvable form, so stub-without-source is expected, not a defect.
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUnannotatedClassAttribute = false
