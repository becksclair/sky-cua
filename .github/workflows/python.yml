name: python

# Runs the Python verification gate on GitHub-hosted runners.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pygobject and pycairo (pulled in by the pygobject-stubs dev
      # dependency) ship only sdists on Linux and build against these.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libgirepository-2.0-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: extractions/setup-just@v4

      # The Python tests read the built Browser Use client.
      - name: Build Browser Use client
        working-directory: packages/browser-use
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Sync Python environment
        run: uv sync --dev

      - name: Verify Python
        run: just verify-python
